name: CI

# Checks every push and pull request, so a problem shows up before a release does.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Debug builds need no signing key, so this runs for pull requests from forks too.
      - name: Unit tests and debug build
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
