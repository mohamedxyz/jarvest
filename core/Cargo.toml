[package]
name = "goal_core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
thiserror = "2"
uniffi = "0.32"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
